<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="1813 Classic badge — Giants Ridge, MN, established 2026">
  <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;display=swap');</style>
  <defs>
    <clipPath id="shield">
      <path d="M38 78 Q38 40 76 40 L244 40 Q282 40 282 78 L282 200 Q282 300 160 328 Q38 300 38 200 Z"/>
    </clipPath>
  </defs>
  <!-- gold outline -->
  <path d="M32 76 Q32 34 74 34 L246 34 Q288 34 288 76 L288 200 Q288 305 160 335 Q32 305 32 200 Z" fill="#d9a62e"/>
  <g clip-path="url(#shield)">
    <!-- gold ground -->
    <rect x="38" y="40" width="244" height="300" fill="#e0af35"/>
    <!-- maroon sky -->
    <path d="M38 40 H282 V166 L200 172 L120 164 L38 172 Z" fill="#5b191c"/>
    <!-- sunburst crest -->
    <g transform="translate(160,84)">
      <g stroke="#d9a62e" stroke-width="1.6" opacity=".9">
        <line x1="0" y1="-34" x2="0" y2="-22"/><line x1="0" y1="34" x2="0" y2="22"/>
        <line x1="-34" y1="0" x2="-22" y2="0"/><line x1="34" y1="0" x2="22" y2="0"/>
        <line x1="-24" y1="-24" x2="-16" y2="-16"/><line x1="24" y1="-24" x2="16" y2="-16"/>
        <line x1="-24" y1="24" x2="-16" y2="16"/><line x1="24" y1="24" x2="16" y2="16"/>
        <line x1="-13" y1="-31" x2="-9" y2="-21"/><line x1="13" y1="-31" x2="9" y2="-21"/>
        <line x1="-31" y1="-13" x2="-21" y2="-9"/><line x1="31" y1="-13" x2="21" y2="-9"/>
        <line x1="-13" y1="31" x2="-9" y2="21"/><line x1="13" y1="31" x2="9" y2="21"/>
        <line x1="-31" y1="13" x2="-21" y2="9"/><line x1="31" y1="13" x2="21" y2="9"/>
      </g>
      <path d="M0 -18 L14 0 L0 18 L-14 0 Z" fill="none" stroke="#d9a62e" stroke-width="3"/>
      <path d="M0 -10 L8 0 L0 10 L-8 0 Z" fill="#d9a62e"/>
    </g>
    <!-- trees -->
    <g fill="#e0af35">
      <path d="M78 118 L100 160 L56 160 Z"/><rect x="73" y="160" width="10" height="12" fill="#3a2012"/>
    </g>
    <g fill="#e0af35">
      <path d="M228 108 L252 156 L204 156 Z"/><rect x="223" y="156" width="10" height="13" fill="#3a2012"/>
      <path d="M258 122 L278 160 L238 160 Z"/><rect x="253" y="160" width="9" height="11" fill="#3a2012"/>
    </g>
    <!-- flag -->
    <rect x="176" y="118" width="4" height="72" rx="2" fill="#3a2012"/>
    <path d="M180 118 L212 128 L180 138 Z" fill="#e9c258"/>
    <ellipse cx="178" cy="192" rx="12" ry="4" fill="#3a2012"/>
    <!-- ball -->
    <circle cx="150" cy="188" r="6" fill="#f9f3e3"/>
    <!-- bunker -->
    <path d="M92 196 Q112 184 132 196 Q112 208 92 196 Z" fill="#3a2012"/>
    <path d="M100 196 Q112 190 124 196" stroke="#e0af35" stroke-width="2" fill="none"/>
