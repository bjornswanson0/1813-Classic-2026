    <text x="160" y="286" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-weight="700" font-size="17" letter-spacing="4" fill="#3a2012">GIANTS RIDGE, MN</text>
    <text x="160" y="308" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-weight="600" font-size="14" letter-spacing="5" fill="#3a2012">EST. 2026</text>
  </g>
  <!-- ribbon banner -->
  <g>
    <path d="M18 216 L52 232 L52 252 L18 268 Z" fill="#2f1a0e"/>
    <path d="M302 216 L268 232 L268 252 L302 268 Z" fill="#2f1a0e"/>
    <rect x="40" y="222" width="240" height="42" fill="#3a2012"/>
    <line x1="48" y1="228" x2="272" y2="228" stroke="#d9a62e" stroke-width="1.5"/>
    <line x1="48" y1="258" x2="272" y2="258" stroke="#d9a62e" stroke-width="1.5"/>
    <text x="160" y="251" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-weight="700" font-size="26" letter-spacing="5" fill="#e9c258">1813 CLASSIC</text>
